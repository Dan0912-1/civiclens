<!DOCTYPE html>

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>CapitolKey: Legislation That Affects You</title>
    <meta name="description" content="See how real legislation affects your life, personalized to your state, grade, and interests." />
    <link rel="canonical" href="https://capitolkey.org/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CapitolKey: Legislation That Affects You" />
    <meta property="og:description" content="See how real legislation affects your life, personalized to your state, grade, and interests." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CapitolKey: Legislation That Affects You" />
    <meta name="twitter:description" content="See how real legislation affects your life, personalized to your state, grade, and interests." />
    <meta name="twitter:image" content="https://capitolkey.org/og-image.png" />

    <!-- Content Security Policy. Fonts are self-hosted (bundled woff2 via
         @fontsource, see src/main.jsx), so font-src is 'self' and the
         render-blocking Google Fonts origins are gone entirely.
         googletagmanager.com is allowed in script-src so the GA4 gtag.js loader
         (injected by src/lib/analytics.js) can run; google-analytics.com +
         googletagmanager.com in connect-src let it send collect/config beacons.
         No 'unsafe-inline' is needed because the loader lives in bundled JS. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.supabase.co https://*.capitolkey.org https://*.railway.app https://*.sentry.io https://*.vercel.app https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src 'none'; base-uri 'self'; form-action 'self';" />

    <!-- Warm DNS+TCP+TLS to the two origins every session hits first: the
         bill feed API and Supabase auth. Saves ~100-300ms on the first data
         fetch on mobile. Dev requests are same-origin and ignore these. -->
    <link rel="preconnect" href="https://civiclens-production-07ed.up.railway.app" />
    <link rel="preconnect" href="https://drljemedyhpyvrzumusd.supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
